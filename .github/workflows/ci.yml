name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings

  zsh:
    name: Zsh integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zsh
        run: sudo apt-get install -y zsh
      - name: Build binary
        run: cargo build --release && cp target/release/smart-suggest bin/
      - name: Run integration tests
        run: zsh tests/integration.zsh

  syntax:
    name: Zsh syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get install -y zsh
      - name: Check plugin syntax
        run: zsh -n smart-context-suggest.plugin.zsh
