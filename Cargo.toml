[package]
name = "smart-suggest"
version = "0.1.1"
edition = "2021"
description = "Context-aware shell suggestion backend for smart-context-suggest zsh plugin"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "smart-suggest"
path = "src/main.rs"
